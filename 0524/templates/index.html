<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulseAI | 智能辦公健康助理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background-color: #f8fafc;
            background-image: radial-gradient(circle at 15% 50%, rgba(6, 182, 212, 0.08), transparent 35%), radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.08), transparent 35%);
            color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow-x: hidden;
        }
        .glass-panel { background: rgba(255, 255, 255, 0.95); border: 1px solid rgba(226, 232, 240, 1); box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.05); transition: all 0.3s; }
        .glass-panel:hover { border-color: rgba(6, 182, 212, 0.3); box-shadow: 0 10px 40px -10px rgba(6, 182, 212, 0.1); }
        .alert-pulse { animation: pulse-alert 2s infinite; }
        @keyframes pulse-alert { 0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } 50% { box-shadow: 0 0 15px 0 rgba(239, 68, 68, 0.2); } }
        .overlay-layer { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 30; transition: all 0.5s ease; }
        .btn-active { border-color: rgba(14, 165, 233, 0.4) !important; background: linear-gradient(135deg, rgba(224, 242, 254, 0.9), rgba(186, 230, 253, 0.6)) !important; color: #0369a1 !important; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8 flex flex-col relative">

    <header class="max-w-7xl mx-auto w-full flex justify-between items-center mb-8 bg-white/95 px-6 py-4 rounded-3xl border border-slate-200 shadow-sm z-40">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-3">
                <div class="relative w-12 h-12 rounded-xl bg-gradient-to-br from-cyan-400 to-indigo-500 flex items-center justify-center shadow-md">
                    <div class="absolute inset-[2px] bg-white rounded-[10px] flex items-center justify-center"><i class="fa-solid fa-shield-heart text-xl text-transparent bg-clip-text bg-gradient-to-r from-cyan-500 to-indigo-500"></i></div>
                </div>
                <h1 class="text-2xl font-black tracking-wider text-slate-800">PULSE<span class="text-cyan-500 font-bold">AI</span></h1>
            </div>
        </div>

        <div class="flex flex-wrap justify-end items-center gap-4">
            <div class="bg-slate-100 p-1.5 rounded-full flex gap-1 border border-slate-200 shadow-inner">
                <button id="btn-mode-25" onclick="setPomodoro(1500, this)" class="btn-active text-xs font-bold text-slate-600 px-4 py-2 rounded-full transition-all border border-transparent">25分</button>
                <button id="btn-mode-15" onclick="setPomodoro(15, this)" class="text-xs font-bold text-slate-500 px-4 py-2 rounded-full hover:bg-white transition-all border border-transparent">15秒</button>
            </div>
            
            <button onclick="openDashboard()" class="glass-panel text-slate-700 px-5 py-2.5 rounded-full hover:border-cyan-300 font-bold text-sm flex items-center gap-2">
                <i class="fa-solid fa-chart-line text-cyan-500"></i> 雲端數據
            </button>
            <button onclick="toggleVoice()" id="btn-voice" class="glass-panel text-slate-500 px-5 py-2.5 rounded-full transition-all duration-300 flex items-center gap-2 group hover:bg-white">
                <i id="icon-voice" class="fa-solid fa-volume-xmark text-slate-400 group-hover:text-slate-600 transition-colors"></i><span class="text-sm font-bold tracking-wide" id="text-voice">靜音</span>
            </button>
            <button onclick="sendReport('daily')" id="btn-report-daily" class="glass-panel text-slate-700 px-5 py-2.5 rounded-full font-bold text-sm flex items-center gap-2"><i class="fa-brands fa-discord text-indigo-500"></i><span id="report-text-daily">發日報</span></button>
            <button onclick="sendReport('weekly')" id="btn-report-weekly" class="glass-panel text-slate-700 px-5 py-2.5 rounded-full font-bold text-sm flex items-center gap-2"><i class="fa-brands fa-discord text-fuchsia-500"></i><span id="report-text-weekly">發週報</span></button>
            <button onclick="recalibrate()" class="glass-panel hover:bg-white text-slate-700 px-5 py-2.5 rounded-full transition-all duration-300 flex items-center gap-2 hover:border-cyan-300 group">
                <i class="fa-solid fa-arrows-rotate group-hover:rotate-180 transition-transform duration-500 text-cyan-500"></i><span class="text-sm font-bold tracking-wide">校正</span>
            </button>
        </div>
    </header>

    <div id="dashboard-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center transition-opacity opacity-0">
        <div class="bg-white w-11/12 max-w-5xl rounded-[2rem] p-8 shadow-2xl relative">
            <button onclick="closeDashboard()" class="absolute top-6 right-6 w-10 h-10 bg-slate-100 text-slate-500 rounded-full hover:bg-slate-200 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
            <h2 class="text-3xl font-black text-slate-800 mb-2"><i class="fa-solid fa-cloud text-cyan-500 mr-2"></i>健康趨勢雲端儀表板</h2>
            <p class="text-slate-500 mb-6">資料由 Google Apps Script 即時載入您的試算表歷史紀錄。</p>
            
            <div id="chart-loading" class="w-full h-80 flex flex-col items-center justify-center bg-slate-50 rounded-2xl border border-slate-200">
                <i class="fa-solid fa-circle-notch fa-spin text-4xl text-cyan-400 mb-4"></i>
                <p class="text-slate-500 font-mono font-bold tracking-widest">FETCHING DATA...</p>
            </div>
            
            <div class="w-full h-80 hidden" id="chart-container">
                <canvas id="healthChart"></canvas>
            </div>
        </div>
    </div>

    <main class="max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-12 gap-8 flex-grow">
        <section class="col-span-1 lg:col-span-7 flex flex-col gap-4">
            <div class="relative rounded-[2rem] overflow-hidden shadow-xl bg-slate-200 border border-slate-300 aspect-video group">
                <img id="video-stream" src="{{ url_for('video_feed') }}" class="w-full h-full object-cover relative z-10 brightness-105">
                <div id="overlay-absent" class="overlay-layer bg-white/95 hidden"><div class="p-10 rounded-3xl bg-white border border-red-100 shadow-2xl text-center"><i class="fa-solid fa-user-astronaut text-6xl text-red-500 mb-6"></i><h2 class="text-3xl font-black text-slate-800 mb-3">無法偵測到使用者</h2></div></div>
                <div id="overlay-calib" class="overlay-layer bg-slate-50/95 hidden"><div class="relative flex flex-col items-center"><i class="fa-solid fa-crosshairs text-6xl text-cyan-500 mb-8 animate-spin" style="animation-duration: 4s;"></i><h2 class="text-3xl font-black text-slate-800 mb-3">環境與特徵校正中</h2><div class="w-80 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm"><div class="w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div id="calib-bar" class="h-full bg-cyan-400" style="width: 0%"></div></div></div></div></div>
                <div id="overlay-exercise" class="overlay-layer bg-indigo-50/95 hidden border-4 border-indigo-400"><h2 id="ex-title" class="text-5xl font-black text-slate-800 mb-10 text-center uppercase">Break</h2><div class="flex items-baseline gap-2 bg-white px-8 py-4 rounded-3xl border border-indigo-100"><span id="ex-progress" class="text-8xl font-black text-cyan-500">0</span><span class="text-4xl text-slate-400">/ <span id="ex-total">5</span></span></div><div class="bg-white px-10 py-5 rounded-2xl border border-cyan-200 mt-8"><span id="ex-status" class="text-2xl font-bold text-amber-500">WAITING</span></div></div>
            </div>
            <div class="flex justify-between items-center px-5 py-3 bg-white/90 rounded-xl mt-1 border border-slate-200 shadow-sm"><span class="text-xs font-bold text-slate-500"><i class="fa-solid fa-microchip text-cyan-500"></i> AI Vision Engine</span><span id="conn-status-text" class="text-xs font-bold text-green-500 flex items-center gap-2">連線中</span></div>
        </section>

        <section class="col-span-1 lg:col-span-5 flex flex-col gap-4">
            <div class="glass-panel rounded-[2rem] p-8 relative overflow-hidden group bg-gradient-to-br from-white to-slate-50 shadow-md">
                <div class="flex justify-between items-end mb-6 relative z-10"><div><p class="text-xs font-bold text-slate-500 mb-2">番茄專注時鐘</p><span class="text-3xl font-black text-slate-800">FOCUS MODE</span></div><div class="text-right"><p class="text-xs font-bold text-slate-500 mb-2">專注倒數</p><p id="timer" class="text-5xl font-mono font-bold text-slate-800">25:00</p></div></div>
                <div class="w-full h-3 bg-slate-200 rounded-full overflow-hidden mb-5"><div id="work-bar" class="h-full bg-gradient-to-r from-rose-400 to-orange-400 transition-all" style="width: 0%"></div></div>
                <div class="flex justify-between items-center mt-4 border-t border-slate-200 pt-5"><span class="text-xs font-bold text-slate-500">今日成就</span><div class="flex items-center gap-1.5" id="tomato-container"></div></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 flex-grow">
                <div id="card-shoulders" data-is-alert="false" class="glass-panel p-5 rounded-2xl flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 icon-container"><i class="fa-solid fa-scale-balanced text-lg"></i></div><div class="flex-grow"><p class="text-[10px] font-bold text-slate-500">高低肩狀態</p><p id="val-shoulders" class="font-bold text-xl text-slate-800">平衡</p></div><i class="fa-solid fa-circle-check text-green-500 status-icon text-xl"></i></div>
                <div id="card-eyes" data-is-alert="false" class="glass-panel p-5 rounded-2xl flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 icon-container"><i class="fa-solid fa-eye text-lg"></i></div><div class="flex-grow"><p class="text-[10px] font-bold text-slate-500">眼部疲勞</p><p id="val-eyes" class="font-bold text-xl text-slate-800">正常</p></div><i class="fa-solid fa-circle-check text-green-500 status-icon text-xl"></i></div>
                <div id="card-mouth" data-is-alert="false" class="glass-panel p-5 rounded-2xl flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 icon-container"><i class="fa-solid fa-face-tired text-lg"></i></div><div class="flex-grow"><p class="text-[10px] font-bold text-slate-500">哈欠與摀嘴</p><p id="val-mouth" class="font-bold text-xl text-slate-800">無</p></div><i class="fa-solid fa-circle-check text-green-500 status-icon text-xl"></i></div>
                <div id="card-dist" data-is-alert="false" class="glass-panel p-5 rounded-2xl flex items-center gap-4"><div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 icon-container"><i class="fa-solid fa-desktop text-lg"></i></div><div class="flex-grow"><p class="text-[10px] font-bold text-slate-500">螢幕距離</p><p id="val-dist" class="font-bold text-xl text-slate-800">適中</p></div><i class="fa-solid fa-circle-check text-green-500 status-icon text-xl"></i></div>
                <div id="card-light" data-is-alert="false" class="glass-panel p-5 rounded-2xl flex items-center gap-4 md:col-span-2 lg:col-span-1"><div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-500 icon-container"><i class="fa-solid fa-lightbulb text-lg"></i></div><div class="flex-grow"><p class="text-[10px] font-bold text-slate-500">環境光源</p><p id="val-light" class="font-bold text-xl text-slate-800">明亮</p></div><i class="fa-solid fa-circle-check text-green-500 status-icon text-xl"></i></div>
            </div>
        </section>
    </main>

    <script>
        const socket = io();
        let myChart = null;

        // 圖表與 Modal
        function openDashboard() {
            const modal = document.getElementById('dashboard-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
            
            document.getElementById('chart-loading').classList.remove('hidden');
            document.getElementById('chart-container').classList.add('hidden');
            socket.emit('request_cloud_data');
        }

        function closeDashboard() {
            const modal = document.getElementById('dashboard-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        socket.on('cloud_data_response', function(res) {
            document.getElementById('chart-loading').classList.add('hidden');
            document.getElementById('chart-container').classList.remove('hidden');
            
            if(res.error) {
                alert("獲取雲端資料失敗：" + res.error);
                return;
            }

            const data = res.data;
            if(!data || data.length === 0) {
                alert("雲端試算表目前沒有資料！請先發送日報。");
                return;
            }

            const labels = data.map(row => {
                let d = new Date(row['日期']); 
                return (d.getMonth()+1) + '/' + d.getDate();
            });
            const workTimes = data.map(row => (row['專注時長(秒)'] / 60).toFixed(1)); 
            const alertEyes = data.map(row => row['閉眼次數'] || 0);
            const alertShoulders = data.map(row => row['高低肩次數'] || 0);
            const alertLight = data.map(row => row['太暗次數'] || 0); // 🚀 圖表新增太暗次數

            const ctx = document.getElementById('healthChart').getContext('2d');
            if(myChart) myChart.destroy(); 

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        { label: '專注時間 (分鐘)', data: workTimes, type: 'line', borderColor: '#06b6d4', backgroundColor: '#06b6d4', borderWidth: 3, tension: 0.3, yAxisID: 'y' },
                        { label: '閉眼警告 (次)', data: alertEyes, backgroundColor: 'rgba(239, 68, 68, 0.5)', yAxisID: 'y1' },
                        { label: '高低肩警告 (次)', data: alertShoulders, backgroundColor: 'rgba(245, 158, 11, 0.5)', yAxisID: 'y1' },
                        { label: '光線太暗 (次)', data: alertLight, backgroundColor: 'rgba(234, 179, 8, 0.5)', yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false,
                    scales: {
                        y: { type: 'linear', display: true, position: 'left', title: {display: true, text:'專注時間(分)'} },
                        y1: { type: 'linear', display: true, position: 'right', grid: {drawOnChartArea: false}, title: {display: true, text:'警報次數'} }
                    }
                }
            });
        });

        // 語音與系統控制
        let isVoiceEnabled = false;
        window.speechUtterances = []; 
        let prevStates = { eyes: "OPEN", distance: "GOOD", shoulders: "BALANCED", mode: "CALIBRATION", light: "GOOD" };
        let lastPomodoroCount = -1; 

        function toggleVoice() {
            isVoiceEnabled = !isVoiceEnabled;
            const btn = document.getElementById('btn-voice'), icon = document.getElementById('icon-voice'), text = document.getElementById('text-voice');
            if (isVoiceEnabled) {
                btn.classList.add('border-emerald-300', 'bg-emerald-50'); btn.classList.remove('border-transparent');
                icon.className = "fa-solid fa-volume-high text-emerald-600";
                text.innerText = "語音開啟"; text.classList.replace('text-slate-500', 'text-emerald-700');
                if (window.speechSynthesis.paused) window.speechSynthesis.resume();
                playVoice("語音提醒已開啟");
            } else {
                btn.classList.remove('border-emerald-300', 'bg-emerald-50'); btn.classList.add('border-transparent');
                icon.className = "fa-solid fa-volume-xmark text-slate-400 group-hover:text-slate-600 transition-colors";
                text.innerText = "靜音"; text.classList.replace('text-emerald-700', 'text-slate-500');
                window.speechSynthesis.cancel(); window.speechUtterances = [];
            }
        }

        function playVoice(text) {
            if (!isVoiceEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW'; utterance.rate = 1.1; utterance.pitch = 1.0;
            window.speechUtterances.push(utterance);
            utterance.onend = function () { const idx = window.speechUtterances.indexOf(utterance); if (idx > -1) window.speechUtterances.splice(idx, 1); };
            utterance.onerror = function () { window.speechSynthesis.cancel(); };
            window.speechSynthesis.speak(utterance);
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
        }

        function recalibrate() { socket.emit('request_recalibrate'); }
        function sendReport(type) {
            document.getElementById('report-text-' + type).innerText = "發送中..."; 
            document.getElementById('btn-report-' + type).classList.add('opacity-50');
            socket.emit('request_discord_report', { type: type });
        }
        function setPomodoro(seconds, btn) {
            document.getElementById('btn-mode-25').className = "text-xs font-bold text-slate-500 px-4 py-2 rounded-full border border-transparent";
            document.getElementById('btn-mode-15').className = "text-xs font-bold text-slate-500 px-4 py-2 rounded-full border border-transparent";
            btn.className = "btn-active text-xs font-bold text-slate-600 px-4 py-2 rounded-full";
            socket.emit('set_pomodoro_time', { seconds: seconds });
        }

        socket.on('report_status', function (data) {
            const rtype = data.type || 'daily', btn = document.getElementById('btn-report-' + rtype);
            document.getElementById('report-text-' + rtype).innerText = data.success ? "成功！" : "失敗";
            setTimeout(() => { document.getElementById('report-text-' + rtype).innerText = rtype === 'daily' ? "發日報" : "發週報"; btn.classList.remove('opacity-50'); }, 3000);
        });

        socket.on('state_update', function (state) {
            if (state.shoulders === "UNEVEN" && prevStates.shoulders !== "UNEVEN") playVoice("肩膀歪斜，請挺直身體。");
            if (state.eyes === "CLOSED" && prevStates.eyes !== "CLOSED") playVoice("偵測到閉眼，請保持清醒。");
            if (state.distance === "TOO CLOSE" && prevStates.distance !== "TOO CLOSE") playVoice("太靠近螢幕了，請往後坐。");
            if (state.light === "TOO DARK" && prevStates.light !== "TOO DARK") playVoice("環境光線不足，請打開檯燈保護眼睛。"); // 🚀 光線語音警報
            if (state.mode === "EXERCISE_HAND" && prevStates.mode === "WORK") playVoice("專注時間結束，請起立活動一下身體吧。");
            prevStates = { shoulders: state.shoulders, eyes: state.eyes, distance: state.distance, light: state.light, mode: state.mode };

            const tr = Math.max(0, state.target_work_time - state.work_time);
            document.getElementById('timer').innerText = `${Math.floor(tr / 60).toString().padStart(2, '0')}:${Math.floor(tr % 60).toString().padStart(2, '0')}`;
            document.getElementById('work-bar').style.width = Math.min((state.work_time / state.target_work_time) * 100, 100) + "%";

            const container = document.getElementById('tomato-container');
            if (state.pomodoro_count > 0 && container.children.length !== state.pomodoro_count) {
                container.innerHTML = Array(state.pomodoro_count).fill('<span class="text-xl">🍅</span>').join('');
            } else if (state.pomodoro_count === 0) container.innerHTML = '';

            document.getElementById('overlay-absent').classList.toggle('hidden', !state.user_absent);
            document.getElementById('overlay-calib').classList.toggle('hidden', state.mode !== "CALIBRATION");
            
            const isEx = state.mode.startsWith("EXERCISE");
            document.getElementById('overlay-exercise').classList.toggle('hidden', !isEx);
            if (isEx) {
                document.getElementById('ex-title').innerText = state.exercise_task.split("(")[0].trim();
                document.getElementById('ex-progress').innerText = state.exercise_progress.split("/")[0].trim();
                document.getElementById('ex-status').innerText = state.exercise_status;
            }

            function update(cid, vid, isAlert, text) {
                const c = document.getElementById(cid), v = document.getElementById(vid);
                if (isAlert) {
                    c.classList.add('alert-pulse', 'border-red-300', 'bg-red-50'); v.className = "font-bold text-xl text-red-600"; v.innerText = text;
                } else {
                    c.classList.remove('alert-pulse', 'border-red-300', 'bg-red-50'); v.className = "font-bold text-xl text-slate-800"; v.innerText = text;
                }
            }

            update('card-shoulders', 'val-shoulders', state.shoulders === "UNEVEN", state.shoulders === "UNEVEN" ? "高低肩！" : "平衡");
            update('card-eyes', 'val-eyes', state.eyes === "CLOSED", state.eyes === "CLOSED" ? "疲勞！" : "正常");
            update('card-mouth', 'val-mouth', state.mouth === "YAWN/COVER", state.mouth === "YAWN/COVER" ? "打哈欠！" : "無");
            update('card-dist', 'val-dist', state.distance === "TOO CLOSE", state.distance === "TOO CLOSE" ? "太近！" : "適中");
            update('card-light', 'val-light', state.light === "TOO DARK", state.light === "TOO DARK" ? "太暗！" : "明亮"); // 🚀 補回光線狀態更新
        });
    </script>
</body>
</html>
